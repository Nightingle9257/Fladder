name: Android Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Read Flutter version
        id: flutter
        run: |
          echo "version=$(jq -r '.flutter' .fvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: |
          flutter build apk \
            --debug \
            --flavor production \
            --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fladder-debug-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-production-debug.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-production-debug.apk
            build/app/outputs/flutter-apk/app-x86_64-production-debug.apk
